<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Odin Recipes</title>
    <script src="checker.js" defer></script>
</head>

<body>

    <h2><a href="./index.html">Back to Home</a></h2>

    <h1>Feedback</h1>

    <p>
        We value your feedback! Please take a few moments to share your thoughts,
        suggestions, and overall experience with Odin's Recipes.
    </p>

    <div id="error" style="color:red;"></div>
    <br>

    <form id="form">

        <label for="name">Name:</label>
        <input type="text" id="name" size="30" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="text" id="email" size="30" required>
        <br><br>

        <strong>Rating:</strong>
        <br><br>

        <div>
            <label>1</label>
            <input type="radio" name="rating" value="1">

            <label>2</label>
            <input type="radio" name="rating" value="2">

            <label>3</label>
            <input type="radio" name="rating" value="3">

            <label>4</label>
            <input type="radio" name="rating" value="4">

            <label>5</label>
            <input type="radio" name="rating" value="5">
        </div>

        <br>

        <label for="comment">Comment:</label><br>
        <textarea id="comment" name="comment" rows="4" cols="50" required></textarea>

        <br><br>

        <input type="submit" value="Submit">

    </form>

    <br>

    <img src="images/ket.jpg" alt="Cool Dude with a Smile" width="200" height="200">

</body>
</html>
